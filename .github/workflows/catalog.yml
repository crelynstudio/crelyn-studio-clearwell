name: Read-only WinGet catalog health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/Check-Catalog.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-health
          path: artifacts/catalog-health.csv
