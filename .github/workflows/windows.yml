name: Windows build and portable preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build, checks, package and independent UI smoke
        shell: pwsh
        run: ./build-release.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearwell-preview-evidence
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
            artifacts/releases/*.json
            artifacts/release-validation-*/checks.txt
            artifacts/release-validation-*/ui/result.txt
